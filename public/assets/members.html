<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>部員一覧 | 欠席管理</title>
    <link rel="stylesheet" href="/assets/css/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/members.css" />
    <script src="/assets/js/knockout.js"></script>
    <script src="/assets/js/members.js"></script>
  </head>
  <body>
    <div class="header">
      <span class="dashboard-title">欠席管理</span>
    </div>
    <div class="nav">
      <a href="/dashboard">ダッシュボード</a>
      <a href="/members">部員一覧</a>
      <a href="/assets/settings.html">設定</a>
      <span class="nav-user">ユーザー名</span>
      <button>ログアウト</button>
    </div>
    <div class="main">
      <div class="members-title">部員一覧</div>
      <div class="members-desc">
        登録されている全部員の情報と欠席状況を確認できます
      </div>
      <table class="members-table">
        <thead>
          <tr>
            <th>部員名</th>
            <th>学年</th>
            <th>欠席回数</th>
            <th>補足</th>
          </tr>
        </thead>
        <tbody data-bind="foreach: members">
          <tr>
            <td data-bind="text: username"></td>
            <td data-bind="text: grade"></td>
            <td>-</td>
            <td data-bind="text: mail"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
